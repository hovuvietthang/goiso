<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Gọi Số Bệnh Nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh ẩn nút tăng giảm mặc định của input number để giao diện sạch hơn */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        /* Hiệu ứng nhấp nháy khi gọi số */
        .calling-animation {
            animation: pulse-bg 1.5s infinite;
        }
        @keyframes pulse-bg {
            0%, 100% { background-color: #f3f4f6; }
            50% { background-color: #dbeafe; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl md:text-2xl font-bold uppercase tracking-wide">Hệ Thống Gọi Bệnh Nhân</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden border border-gray-100">
            
            <div class="p-6 md:p-8 space-y-6">
                <!-- Tùy chỉnh câu gọi -->
                <div class="space-y-2">
                    <label for="prefixText" class="block text-sm font-semibold text-gray-700">Câu nhắc trước khi đọc số:</label>
                    <input type="text" id="prefixText" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-gray-800 text-base md:text-lg shadow-sm"
                        value="Phòng khám Y học cổ truyền xin mời bệnh nhân số" 
                        placeholder="VD: Mời bệnh nhân, số...">
                </div>

                <!-- Hiển thị số lớn -->
                <div id="displayArea" class="bg-gray-50 rounded-2xl py-12 text-center transition-colors duration-300 border-2 border-dashed border-gray-200">
                    <p class="text-gray-500 font-medium mb-2">Đang gọi số</p>
                    <div id="numberDisplay" class="text-7xl md:text-8xl font-black text-blue-600 tabular-nums tracking-tighter">
                        0
                    </div>
                </div>

                <!-- Nhập số trực tiếp -->
                <div class="flex justify-center">
                    <div class="relative w-48">
                        <input type="number" id="numberInput" 
                            class="w-full text-center text-3xl font-bold px-4 py-3 rounded-xl border-2 border-gray-300 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800 shadow-sm"
                            value="1" min="0">
                        <span class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-white px-2 text-xs font-semibold text-gray-500 rounded">Nhập số</span>
                    </div>
                </div>

                <!-- Cụm nút điều khiển -->
                <div class="grid grid-cols-3 gap-3 md:gap-4 pt-4">
                    <button id="btnPrev" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-4 rounded-xl text-lg md:text-xl transition-colors shadow-sm active:scale-95 flex flex-col items-center justify-center gap-1">
                        <span class="text-2xl leading-none">-</span>
                        <span class="text-xs font-normal">Lùi số</span>
                    </button>
                    
                    <button id="btnCall" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg md:text-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex flex-col items-center justify-center gap-1 border border-blue-500">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                        <span class="text-sm font-semibold uppercase tracking-wider">Gọi Loa</span>
                    </button>
                    
                    <button id="btnNext" class="bg-green-100 hover:bg-green-200 text-green-700 font-bold py-4 rounded-xl text-lg md:text-xl transition-colors shadow-sm active:scale-95 flex flex-col items-center justify-center gap-1">
                        <span class="text-2xl leading-none">+</span>
                        <span class="text-xs font-normal">Tiếp theo</span>
                    </button>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Trạng thái -->
    <div id="status" class="text-center p-4 text-sm font-medium text-gray-500">
        Trạng thái loa: Sẵn sàng
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const numberInput = document.getElementById('numberInput');
            const numberDisplay = document.getElementById('numberDisplay');
            const prefixText = document.getElementById('prefixText');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnCall = document.getElementById('btnCall');
            const displayArea = document.getElementById('displayArea');
            const statusLabel = document.getElementById('status');

            // Cập nhật số hiển thị to khi gõ vào ô input
            numberInput.addEventListener('input', () => {
                if (numberInput.value !== '') {
                    numberDisplay.textContent = numberInput.value;
                }
            });

            // Xử lý phím Enter trên ô input số
            numberInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    triggerCall();
                }
            });

            // Xử lý nút bấm
            btnNext.addEventListener('click', () => {
                numberInput.value = parseInt(numberInput.value || 0) + 1;
                numberDisplay.textContent = numberInput.value;
                triggerCall();
            });

            btnPrev.addEventListener('click', () => {
                let currentVal = parseInt(numberInput.value || 0);
                if (currentVal > 1) {
                    numberInput.value = currentVal - 1;
                    numberDisplay.textContent = numberInput.value;
                }
            });

            btnCall.addEventListener('click', triggerCall);

            // AudioContext để tạo tiếng chuông nội bộ (không cần file âm thanh ngoài)
            let audioCtx = null;

            function playDingDong(callback) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Tiếng "Ding" (Nốt G5)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(784, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0, audioCtx.currentTime);
                gain1.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.5);

                // Tiếng "Dong" (Nốt E5)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0, audioCtx.currentTime + 0.5);
                gain2.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.55);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc2.start(audioCtx.currentTime + 0.5);
                osc2.stop(audioCtx.currentTime + 1.5);

                // Gọi hàm callback đọc text sau khi chuông kêu xong (khoảng 1.2s)
                setTimeout(callback, 1200);
            }

            function triggerCall() {
                const number = numberInput.value;
                if (!number) return;

                // Disable các nút tránh bấm liên tục
                setControlsState(true);
                displayArea.classList.add('calling-animation');
                
                const prefix = prefixText.value.trim() || "Mời bệnh nhân, số";
                const textToSpeak = `${prefix} ${number}`;
                
                statusLabel.innerHTML = `<span class="text-blue-600">Đang phát tiếng chuông...</span>`;

                // Phát chuông, sau đó đọc chữ
                playDingDong(() => {
                    statusLabel.innerHTML = `<span class="text-green-600">Đang đọc số...</span>`;
                    
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(textToSpeak);
                        utterance.lang = 'vi-VN'; // Giọng Tiếng Việt
                        utterance.rate = 0.9; // Tốc độ đọc vừa phải
                        utterance.pitch = 1;
                        
                        // Khi đọc xong
                        utterance.onend = () => {
                            resetState();
                        };
                        
                        // Bắt lỗi nếu có
                        utterance.onerror = (event) => {
                            console.error('SpeechSynthesisError:', event);
                            statusLabel.innerHTML = `<span class="text-red-500">Lỗi phát âm thanh. Vui lòng thử lại.</span>`;
                            resetState();
                        };

                        window.speechSynthesis.speak(utterance);
                    } else {
                        alert("Trình duyệt của bạn không hỗ trợ đọc văn bản (Text-to-Speech).");
                        resetState();
                    }
                });
            }

            function setControlsState(disabled) {
                btnNext.disabled = disabled;
                btnPrev.disabled = disabled;
                btnCall.disabled = disabled;
                numberInput.disabled = disabled;
            }

            function resetState() {
                setControlsState(false);
                displayArea.classList.remove('calling-animation');
                statusLabel.innerHTML = `Trạng thái loa: Sẵn sàng`;
                // Tự động focus lại vào ô số để gõ tiếp
                numberInput.focus();
                numberInput.select();
            }
        });
    </script>
</body>
</html>
