<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Gọi Số Bệnh Nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .calling-animation {
            animation: pulse-bg 1.5s infinite;
        }
        @keyframes pulse-bg {
            0%, 100% { background-color: #f3f4f6; }
            50% { background-color: #dbeafe; }
        }
        input[type=range] {
            accent-color: #2563eb;
        }
    </style>
</head>
<body class="bg-gray-100 h-[100dvh] flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-3 shadow-md text-center shrink-0">
        <h1 class="text-lg md:text-xl font-bold uppercase tracking-wide">Hệ Thống Gọi Bệnh Nhân</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-3 md:p-4 min-h-0">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg flex flex-col border border-gray-100 max-h-full">
            
            <div class="p-4 flex flex-col gap-3 overflow-y-auto">
                
                <!-- CỤM CÀI ĐẶT -->
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-3 shrink-0">
                    <div class="space-y-1">
                        <label for="prefixText" class="block text-xs font-semibold text-gray-700">Câu nhắc:</label>
                        <input type="text" id="prefixText" 
                            class="w-full px-3 py-1.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 transition-colors text-gray-800 text-sm shadow-sm"
                            value="Phòng điều trị Y học cổ truyền xin mời khách hàng số" 
                            placeholder="VD: Mời bệnh nhân, số...">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label for="voiceSelect" class="block text-xs font-semibold text-gray-700">Giọng đọc:</label>
                            <select id="voiceSelect" class="w-full px-2 py-1.5 rounded-lg border border-gray-300 bg-white text-xs text-gray-800 shadow-sm focus:ring-2 focus:ring-blue-500">
                                <option value="">Đang tải giọng...</option>
                            </select>
                        </div>
                        
                        <div class="space-y-1">
                            <label for="rateInput" class="block text-xs font-semibold text-gray-700 flex justify-between">
                                <span>Tốc độ:</span>
                                <span id="rateDisplay" class="text-blue-600 font-bold">0.9x</span>
                            </label>
                            <input type="range" id="rateInput" min="0.5" max="1.5" step="0.1" value="0.9" class="w-full h-4 mt-1">
                        </div>
                    </div>
                </div>

                <!-- Hiển thị số lớn -->
                <div id="displayArea" class="bg-blue-50/50 rounded-xl py-4 md:py-5 text-center transition-colors duration-300 border-2 border-dashed border-blue-200 shrink-0">
                    <p class="text-blue-500/80 text-xs font-medium mb-1">Đang gọi số</p>
                    <div id="numberDisplay" class="text-6xl md:text-7xl font-black text-blue-600 tabular-nums tracking-tighter leading-none transition-all">
                        1
                    </div>
                </div>

                <!-- Nhập số trực tiếp -->
                <div class="flex justify-center shrink-0">
                    <div class="relative w-48">
                        <input type="text" id="numberInput" inputmode="text"
                            class="w-full text-center text-2xl font-bold px-3 py-2 rounded-xl border-2 border-gray-300 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800 shadow-sm"
                            value="1" placeholder="VD: 1 2 3">
                        <span class="absolute -top-2.5 left-1/2 transform -translate-x-1/2 bg-white px-2 text-[10px] font-semibold text-gray-500 rounded">Nhập số</span>
                    </div>
                </div>

                <!-- Cụm nút điều khiển chính -->
                <div class="grid grid-cols-3 gap-2 shrink-0">
                    <button id="btnPrev" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-colors shadow-sm active:scale-95 flex flex-col items-center justify-center gap-0.5">
                        <span class="text-xl leading-none">-</span>
                        <span class="text-[10px] font-normal">Lùi số</span>
                    </button>
                    
                    <button id="btnCall" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex flex-col items-center justify-center gap-0.5 border border-blue-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                        <span class="text-[10px] font-semibold uppercase tracking-wider">Gọi Loa</span>
                    </button>
                    
                    <button id="btnNext" class="bg-green-100 hover:bg-green-200 text-green-700 font-bold py-3 rounded-xl transition-colors shadow-sm active:scale-95 flex flex-col items-center justify-center gap-0.5">
                        <span class="text-xl leading-none">+</span>
                        <span class="text-[10px] font-normal">Tiếp theo</span>
                    </button>
                </div>

                <!-- Cụm nút gọi nhanh nhiều số (TÍNH NĂNG MỚI) -->
                <div class="grid grid-cols-3 gap-2 shrink-0">
                    <button id="btnNext1" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2 rounded-xl transition-colors shadow-sm active:scale-95 text-xs border border-indigo-200">
                        +1 số tiếp
                    </button>
                    <button id="btnNext2" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2 rounded-xl transition-colors shadow-sm active:scale-95 text-xs border border-indigo-200">
                        +2 số tiếp
                    </button>
                    <button id="btnNext3" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2 rounded-xl transition-colors shadow-sm active:scale-95 text-xs border border-indigo-200">
                        +3 số tiếp
                    </button>
                </div>

                <div id="status" class="text-center text-xs font-medium text-gray-500 shrink-0 mt-1">
                    Trạng thái loa: Sẵn sàng
                </div>
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-2 shrink-0">
        <a href="https://lamthangphat.com" target="_blank" rel="noopener noreferrer" class="block text-center px-4 hover:opacity-75 transition-opacity">
            <p class="text-gray-700 text-xs font-medium">
                Phát triển bởi <strong>Bác sĩ Hồ Vũ Việt Thắng</strong>
            </p>
            <p class="text-gray-500 text-[10px] mt-0.5">
                Giải pháp thuộc <span class="font-semibold text-blue-600">MEDS System</span> - Lâm Thắng Phát
            </p>
        </a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const numberInput = document.getElementById('numberInput');
            const numberDisplay = document.getElementById('numberDisplay');
            const prefixText = document.getElementById('prefixText');
            const voiceSelect = document.getElementById('voiceSelect');
            const rateInput = document.getElementById('rateInput');
            const rateDisplay = document.getElementById('rateDisplay');
            const displayArea = document.getElementById('displayArea');
            const statusLabel = document.getElementById('status');

            // Các nút
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnCall = document.getElementById('btnCall');
            const btnNext1 = document.getElementById('btnNext1');
            const btnNext2 = document.getElementById('btnNext2');
            const btnNext3 = document.getElementById('btnNext3');
            
            const allButtons = [btnPrev, btnNext, btnCall, btnNext1, btnNext2, btnNext3];

            let audioCtx = null;
            let isIOSUnlocked = false;
            let availableVoices = [];

            // --- QUẢN LÝ GIỌNG ĐỌC ---
            function populateVoiceList() {
                availableVoices = window.speechSynthesis.getVoices();
                if (availableVoices.length === 0) return;

                let viVoices = availableVoices.filter(voice => 
                    voice.lang.includes('vi') || 
                    voice.lang.includes('VN') || 
                    voice.name.toLowerCase().includes('vietnamese') || 
                    voice.name.toLowerCase().includes('an')
                );

                const voicesToShow = viVoices.length > 0 ? viVoices : availableVoices;
                
                voiceSelect.innerHTML = '';
                voicesToShow.forEach(voice => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = voice.voiceURI;
                    voiceSelect.appendChild(option);
                });

                const savedVoice = localStorage.getItem('savedVoice');
                if (savedVoice && voicesToShow.some(v => v.voiceURI === savedVoice)) {
                    voiceSelect.value = savedVoice;
                } else {
                    const bestFemaleVoice = voicesToShow.find(v => 
                        v.name.includes('Linh') || v.name.includes('An') || v.name.includes('Google')
                    );
                    if (bestFemaleVoice) {
                        voiceSelect.value = bestFemaleVoice.voiceURI;
                    }
                }
            }

            if ('speechSynthesis' in window) {
                populateVoiceList();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = populateVoiceList;
                }
            }

            // --- LOCAL STORAGE ---
            if (localStorage.getItem('savedPrefix')) prefixText.value = localStorage.getItem('savedPrefix');
            if (localStorage.getItem('savedRate')) {
                rateInput.value = localStorage.getItem('savedRate');
                rateDisplay.textContent = rateInput.value + 'x';
            }

            prefixText.addEventListener('input', () => localStorage.setItem('savedPrefix', prefixText.value));
            rateInput.addEventListener('input', () => {
                rateDisplay.textContent = rateInput.value + 'x';
                localStorage.setItem('savedRate', rateInput.value);
            });
            voiceSelect.addEventListener('change', () => localStorage.setItem('savedVoice', voiceSelect.value));

            // --- UNLOCK IOS ---
            function unlockAudioAndSpeech() {
                if (isIOSUnlocked) return;
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                if ('speechSynthesis' in window) {
                    const unlockMsg = new SpeechSynthesisUtterance('');
                    unlockMsg.volume = 0; 
                    window.speechSynthesis.speak(unlockMsg);
                }
                isIOSUnlocked = true;
                document.removeEventListener('touchstart', unlockAudioAndSpeech);
                document.removeEventListener('click', unlockAudioAndSpeech);
            }

            document.addEventListener('touchstart', unlockAudioAndSpeech, { once: true });
            document.addEventListener('click', unlockAudioAndSpeech, { once: true });

            // --- HÀM GỌI NHANH N SỐ (TÍNH NĂNG MỚI) ---
            function callNextN(count) {
                unlockAudioAndSpeech();
                const numbers = numberInput.value.match(/\d+/g);
                let startVal = 0;
                if (numbers && numbers.length > 0) {
                    // Lấy số cuối cùng trong chuỗi hiện tại
                    startVal = parseInt(numbers[numbers.length - 1]);
                }
                
                let nextNumbers = [];
                for (let i = 1; i <= count; i++) {
                    nextNumbers.push(startVal + i);
                }
                
                numberInput.value = nextNumbers.join(", ");
                triggerCall();
            }

            // Gắn sự kiện cho cụm nút mới
            btnNext1.addEventListener('click', () => callNextN(1));
            btnNext2.addEventListener('click', () => callNextN(2));
            btnNext3.addEventListener('click', () => callNextN(3));

            // Các nút cũ
            numberInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); triggerCall(); numberInput.blur(); }
            });

            btnNext.addEventListener('click', () => callNextN(1)); // Nút "+" mặc định là gọi 1 số tiếp

            btnPrev.addEventListener('click', () => {
                const numbers = numberInput.value.match(/\d+/g);
                let prevVal = 1;
                if (numbers && numbers.length > 0) {
                    prevVal = parseInt(numbers[0]);
                    if (prevVal > 1) prevVal -= 1;
                }
                numberInput.value = prevVal;
                adjustDisplayFontSize(String(prevVal));
            });

            btnCall.addEventListener('click', () => {
                unlockAudioAndSpeech();
                triggerCall();
            });

            // --- AUDIO & SPEECH ---
            function playDingDongFast() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1); gain1.connect(audioCtx.destination);
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(784, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0, audioCtx.currentTime);
                gain1.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc1.start(audioCtx.currentTime); osc1.stop(audioCtx.currentTime + 0.3);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.type = 'sine'; osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);
                gain2.gain.setValueAtTime(0, audioCtx.currentTime + 0.3);
                gain2.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.35);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc2.start(audioCtx.currentTime + 0.3); osc2.stop(audioCtx.currentTime + 0.8);
            }

            function adjustDisplayFontSize(text) {
                numberDisplay.textContent = text;
                if (text.length > 5) {
                    numberDisplay.classList.remove('text-6xl', 'md:text-7xl');
                    numberDisplay.classList.add('text-4xl', 'md:text-5xl');
                } else {
                    numberDisplay.classList.remove('text-4xl', 'md:text-5xl');
                    numberDisplay.classList.add('text-6xl', 'md:text-7xl');
                }
            }

            function triggerCall() {
                const rawInput = numberInput.value;
                const numbersArr = rawInput.match(/\d+/g);
                if (!numbersArr || numbersArr.length === 0) return;

                setControlsState(true);
                displayArea.classList.add('calling-animation');
                
                const rawPrefix = prefixText.value.trim() || "Mời bệnh nhân";
                const cleanPrefix = rawPrefix.replace(/số\s*$/i, '').trim();
                
                let textToSpeak = "";
                let displayStr = "";

                if (numbersArr.length === 1) {
                    displayStr = numbersArr[0];
                    textToSpeak = `${cleanPrefix} số ${numbersArr[0]}`;
                } else {
                    displayStr = numbersArr.join(", ");
                    const spokenNumbers = numbersArr.map(n => `số ${n}`).join(", ");
                    textToSpeak = `${cleanPrefix} ${spokenNumbers}`;
                }

                adjustDisplayFontSize(displayStr);
                statusLabel.innerHTML = `<span class="text-green-600">Đang phát loa...</span>`;

                playDingDongFast();

                if ('speechSynthesis' in window) {
                    const delayUtt = new SpeechSynthesisUtterance("chờ");
                    delayUtt.volume = 0; delayUtt.rate = 0.8; 
                    
                    const mainUtt = new SpeechSynthesisUtterance(textToSpeak);
                    mainUtt.rate = parseFloat(rateInput.value); 
                    mainUtt.pitch = 1;
                    mainUtt.volume = 1; 

                    const selectedVoiceURI = voiceSelect.value;
                    if (selectedVoiceURI) {
                        const voiceToUse = availableVoices.find(v => v.voiceURI === selectedVoiceURI);
                        if (voiceToUse) mainUtt.voice = voiceToUse;
                    }
                    
                    mainUtt.onend = () => { resetState(); };
                    mainUtt.onerror = (event) => {
                        console.error('SpeechSynthesisError:', event);
                        statusLabel.innerHTML = `<span class="text-red-500">Lỗi âm thanh. Thử lại.</span>`;
                        resetState();
                    };

                    window.speechSynthesis.speak(delayUtt);
                    window.speechSynthesis.speak(mainUtt);
                } else {
                    alert("Trình duyệt không hỗ trợ đọc văn bản.");
                    resetState();
                }
            }

            function setControlsState(disabled) {
                allButtons.forEach(btn => btn.disabled = disabled);
                numberInput.disabled = disabled;
                prefixText.disabled = disabled;
                voiceSelect.disabled = disabled;
                rateInput.disabled = disabled;
            }

            function resetState() {
                setControlsState(false);
                displayArea.classList.remove('calling-animation');
                statusLabel.innerHTML = `Trạng thái loa: Sẵn sàng`;
            }
        });
    </script>
</body>
</html>
