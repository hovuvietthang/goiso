<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Gọi Số Bệnh Nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .calling-animation {
            animation: pulse-bg 1.5s infinite;
        }
        @keyframes pulse-bg {
            0%, 100% { background-color: #f3f4f6; }
            50% { background-color: #dbeafe; }
        }
    </style>
</head>
<body class="bg-gray-100 h-[100dvh] flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-3 shadow-md text-center shrink-0">
        <h1 class="text-lg md:text-xl font-bold uppercase tracking-wide">Hệ Thống Gọi Bệnh Nhân</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-3 md:p-4 min-h-0">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg flex flex-col border border-gray-100 max-h-full">
            
            <div class="p-4 md:p-6 flex flex-col gap-4 overflow-y-auto">
                <div class="space-y-1">
                    <label for="prefixText" class="block text-xs font-semibold text-gray-700">Câu nhắc (Có thể sửa):</label>
                    <input type="text" id="prefixText" 
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-gray-800 text-sm md:text-base shadow-sm"
                        value="Phòng điều trị Y học cổ truyền xin mời khách hàng số" 
                        placeholder="VD: Mời bệnh nhân, số...">
                </div>

                <div id="displayArea" class="bg-gray-50 rounded-xl py-6 md:py-8 text-center transition-colors duration-300 border-2 border-dashed border-gray-200 shrink-0">
                    <p class="text-gray-500 text-sm font-medium mb-1">Đang gọi số</p>
                    <div id="numberDisplay" class="text-6xl md:text-7xl font-black text-blue-600 tabular-nums tracking-tighter leading-none">
                        1
                    </div>
                </div>

                <div class="flex justify-center shrink-0 mt-2">
                    <div class="relative w-40">
                        <input type="number" id="numberInput" 
                            class="w-full text-center text-2xl font-bold px-3 py-2 rounded-xl border-2 border-gray-300 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-gray-800 shadow-sm"
                            value="1" min="0">
                        <span class="absolute -top-2.5 left-1/2 transform -translate-x-1/2 bg-white px-2 text-[10px] font-semibold text-gray-500 rounded">Nhập số</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 md:gap-3 shrink-0 mt-1">
                    <button id="btnPrev" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-colors shadow-sm active:scale-95 flex flex-col items-center justify-center gap-0.5">
                        <span class="text-xl leading-none">-</span>
                        <span class="text-[10px] md:text-xs font-normal">Lùi số</span>
                    </button>
                    
                    <button id="btnCall" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex flex-col items-center justify-center gap-0.5 border border-blue-500">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                        <span class="text-[10px] md:text-xs font-semibold uppercase tracking-wider">Gọi Loa</span>
                    </button>
                    
                    <button id="btnNext" class="bg-green-100 hover:bg-green-200 text-green-700 font-bold py-3 rounded-xl transition-colors shadow-sm active:scale-95 flex flex-col items-center justify-center gap-0.5">
                        <span class="text-xl leading-none">+</span>
                        <span class="text-[10px] md:text-xs font-normal">Tiếp theo</span>
                    </button>
                </div>

                <div id="status" class="text-center text-xs font-medium text-gray-500 shrink-0">
                    Trạng thái loa: Sẵn sàng
                </div>
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-2 shrink-0">
        <a href="https://lamthangphat.com" target="_blank" rel="noopener noreferrer" class="block text-center px-4 hover:opacity-75 transition-opacity">
            <p class="text-gray-700 text-xs font-medium">
                Phát triển bởi <strong>Bác sĩ Hồ Vũ Việt Thắng</strong>
            </p>
            <p class="text-gray-500 text-[10px] mt-0.5">
                Giải pháp thuộc <span class="font-semibold text-blue-600">MEDS System</span> - Lâm Thắng Phát
            </p>
        </a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const numberInput = document.getElementById('numberInput');
            const numberDisplay = document.getElementById('numberDisplay');
            const prefixText = document.getElementById('prefixText');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnCall = document.getElementById('btnCall');
            const displayArea = document.getElementById('displayArea');
            const statusLabel = document.getElementById('status');

            let audioCtx = null;
            let isIOSUnlocked = false;
            let availableVoices = [];

            // --- TẢI DANH SÁCH GIỌNG NÓI TRƯỚC (RẤT QUAN TRỌNG TRÊN MÁY TÍNH) ---
            function loadVoices() {
                availableVoices = window.speechSynthesis.getVoices();
            }
            if ('speechSynthesis' in window) {
                loadVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = loadVoices;
                }
            }
            // -----------------------------------------------------------------

            function unlockAudioAndSpeech() {
                if (isIOSUnlocked) return;
                
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                if ('speechSynthesis' in window) {
                    const unlockMsg = new SpeechSynthesisUtterance('');
                    unlockMsg.volume = 0; 
                    window.speechSynthesis.speak(unlockMsg);
                }

                isIOSUnlocked = true;
                document.removeEventListener('touchstart', unlockAudioAndSpeech);
                document.removeEventListener('click', unlockAudioAndSpeech);
            }

            document.addEventListener('touchstart', unlockAudioAndSpeech, { once: true });
            document.addEventListener('click', unlockAudioAndSpeech, { once: true });

            if (localStorage.getItem('savedPrefix')) {
                prefixText.value = localStorage.getItem('savedPrefix');
            }
            prefixText.addEventListener('input', () => {
                localStorage.setItem('savedPrefix', prefixText.value);
            });

            numberInput.addEventListener('input', () => {
                if (numberInput.value !== '') {
                    numberDisplay.textContent = numberInput.value;
                }
            });

            numberInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    triggerCall();
                    numberInput.blur();
                }
            });

            btnNext.addEventListener('click', () => {
                unlockAudioAndSpeech(); 
                numberInput.value = parseInt(numberInput.value || 0) + 1;
                numberDisplay.textContent = numberInput.value;
                triggerCall();
            });

            btnPrev.addEventListener('click', () => {
                let currentVal = parseInt(numberInput.value || 0);
                if (currentVal > 1) {
                    numberInput.value = currentVal - 1;
                    numberDisplay.textContent = numberInput.value;
                }
            });

            btnCall.addEventListener('click', () => {
                unlockAudioAndSpeech();
                triggerCall();
            });

            function playDingDongFast() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(784, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0, audioCtx.currentTime);
                gain1.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.3);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);
                gain2.gain.setValueAtTime(0, audioCtx.currentTime + 0.3);
                gain2.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.35);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc2.start(audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.8);
            }

            function triggerCall() {
                const number = numberInput.value;
                if (!number) return;

                setControlsState(true);
                displayArea.classList.add('calling-animation');
                
                const prefix = prefixText.value.trim() || "Mời bệnh nhân, số";
                const textToSpeak = `${prefix} ${number}`;
                
                statusLabel.innerHTML = `<span class="text-green-600">Đang phát loa...</span>`;

                playDingDongFast();

                if ('speechSynthesis' in window) {
                    const delayUtt = new SpeechSynthesisUtterance("đang phát chuông báo");
                    delayUtt.volume = 0; 
                    delayUtt.rate = 0.8; 
                    
                    const mainUtt = new SpeechSynthesisUtterance(textToSpeak);
                    mainUtt.lang = 'vi-VN'; 
                    mainUtt.rate = 0.9; 
                    mainUtt.pitch = 1;
                    mainUtt.volume = 1; 

                    // --- BỘ LỌC TÌM KIẾM GIỌNG TIẾNG VIỆT ĐÍCH DANH ---
                    // Trình duyệt (Chrome/Edge) thường lưu tên giọng đọc là "Google Tiếng Việt", "Microsoft An", hoặc có mã "vi-VN"
                    const viVoice = availableVoices.find(voice => 
                        voice.lang.includes('vi') || 
                        voice.lang.includes('VN') || 
                        voice.name.toLowerCase().includes('vietnamese') || 
                        voice.name.toLowerCase().includes('an') // Microsoft An
                    );
                    
                    if (viVoice) {
                        mainUtt.voice = viVoice;
                    }
                    // --------------------------------------------------
                    
                    mainUtt.onend = () => { resetState(); };
                    mainUtt.onerror = (event) => {
                        console.error('SpeechSynthesisError:', event);
                        statusLabel.innerHTML = `<span class="text-red-500">Lỗi âm thanh. Thử lại.</span>`;
                        resetState();
                    };

                    window.speechSynthesis.speak(delayUtt);
                    window.speechSynthesis.speak(mainUtt);
                } else {
                    alert("Trình duyệt không hỗ trợ đọc văn bản.");
                    resetState();
                }
            }

            function setControlsState(disabled) {
                btnNext.disabled = disabled;
                btnPrev.disabled = disabled;
                btnCall.disabled = disabled;
                numberInput.disabled = disabled;
                prefixText.disabled = disabled;
            }

            function resetState() {
                setControlsState(false);
                displayArea.classList.remove('calling-animation');
                statusLabel.innerHTML = `Trạng thái loa: Sẵn sàng`;
            }
        });
    </script>
</body>
</html>
